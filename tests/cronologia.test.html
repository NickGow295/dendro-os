<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas del motor · DENDRO-OS</title>
  <style>
    body { margin: 0; padding: 24px; background: var(--fondo); color: var(--texto); font: 15px/1.5 monospace; }
    h1 { color: var(--ambar); font-size: 18px; letter-spacing: 0.1em; }
    .resumen { margin: 12px 0 20px; font-weight: bold; }
    .ok { color: var(--exito); }
    .fallo { color: var(--peligro); }
    li { list-style: none; margin: 2px 0; }
    li::before { content: "· "; color: var(--ambar-tenue); }
  </style>
</head>
<body>
  <h1>DENDRO-OS · PRUEBAS DEL MOTOR DE CRONOLOGÍA</h1>
  <div id="resumen" class="resumen"></div>
  <ul id="lista"></ul>

  <script src="../config.js"></script>
  <script src="../data/myth.js"></script>
  <script src="../data/tierras.js"></script>
  <script src="../data/tierra-gris.js"></script>
  <script src="../data/generacion.js"></script>
  <script src="../data/colisiones.js"></script>
  <script src="../data/eventos.js"></script>
  <script src="../js/nucleo/prng.js"></script>
  <script src="../data/mensajes.js"></script>
  <script src="../data/archivo.js"></script>
  <script src="../data/revelaciones.js"></script>
  <script src="../data/protocolos.js"></script>
  <script src="../js/nucleo/reloj.js"></script>
  <script src="../js/nucleo/ruido.js"></script>
  <script src="../js/nucleo/tau.js"></script>
  <script src="../js/nucleo/sha256.js"></script>
  <script src="../js/nucleo/multiverso.js"></script>
  <script src="../js/nucleo/tema.js"></script>
  <script src="../js/nucleo/cronologia.js"></script>
  <script src="../js/ui/globo.js"></script>
  <script src="../js/nucleo/local.js"></script>
  <script>
    (function () {
      "use strict";
      DENDRO.tema.aplicar();
      const cr = DENDRO_CONFIG.cronologia;
      const HORA = 3600000;
      const ms = (x) => DENDRO.reloj.aInstante(x);
      const en = (x) => DENDRO.cronologia.calcularEstado(x);
      const par = (e, id) => e.parejas.find((p) => p.id === id);
      const tierra = (e, codigo) => e.tierras.porCodigo(codigo);
      const enColision = (e) => e.enColision;
      const VELMORA = "MYTH·4K·7A2·R9", OSTRAKH = "MYTH·4K·7A2·T3", CENIZA = "MYTH·9F·E07·K4", ARBOREA = "MYTH·9F·E07·W1";
      const DIA = 24 * 3600000;
      const resultados = [];
      const comprobar = (nombre, fn) => {
        let ok = false, detalle = "";
        try { const r = fn(); ok = r === true; if (!ok && r) detalle = String(r); } catch (err) { detalle = err.message; }
        resultados.push({ nombre, ok, detalle });
      };

      // Criterios de 01-requisitos.md §5
      comprobar("10-19: fase 0 NOMINAL, 0 ramas", () => en("2026-10-19T12:00").fase === 0 && en("2026-10-19T12:00").ramasAfectadas === 0);
      comprobar("10-20: fase 1, alerta ÁMBAR, 0 ramas", () => { const e = en("2026-10-20T12:00"); return e.fase === 1 && e.nivelAlerta === "ÁMBAR" && e.ramasAfectadas === 0; });
      comprobar("10-27 03:16: todavía ninguna colisión", () => { const e = en("2026-10-27T03:16"); return e.ramasAfectadas === 0 && enColision(e) === 0; });
      comprobar("10-27 03:17: exactamente 2 ramas y C-01 en CONTACTO", () => { const e = en(cr.primeraColision); return e.ramasAfectadas === 2 && par(e, "C-01").estado === "CONTACTO"; });
      comprobar("10-27 12:00: 2 ramas en colisión (Velmora y Ostrakh)", () => enColision(en("2026-10-27T12:00")) === 2);
      comprobar("12-16 13:59: recta final, fase 4, intensidad máxima", () => { const e = en("2026-12-16T13:59"); return e.fase === 4 && e.rectaFinal && e.intensidad === DENDRO_CONFIG.efectos.glitchMaximo; });
      comprobar("12-16 14:00: fase 5 COLAPSO y ramas = ramasAfectadasFinal", () => { const e = en(cr.colapsoTotal); return e.fase === 5 && e.ramasAfectadas === cr.ramasAfectadasFinal && e.paraColapso === 0; });
      comprobar("12-25: sigue en COLAPSO", () => en("2026-12-25T12:00").fase === 5);
      comprobar("Al menos 4 parejas nombradas hostiles", () => en(cr.inicioAlerta).parejas.filter((p) => p.nombrada && /hostil/.test(p.postura)).length >= 4);
      comprobar("10-27: solo C-01 está en contacto", () => {
        const e = en("2026-10-27T12:00");
        return e.parejas.filter((p) => ["CONTACTO", "HOSTILIDADES", "INTERFERENCIA"].includes(p.estado)).map((p) => p.id).join() === "C-01";
      });
      comprobar("Determinismo: el mismo minuto da el mismo Estado", () => JSON.stringify(en("2026-11-20T15:42")) === JSON.stringify(en(ms("2026-11-20T15:42") + 30000)));

      comprobar("Monotonía hora a hora 20/10 → 17/12: ramas, ramas en colisión y fase", () => {
        let antes = null;
        for (let t = ms(cr.inicioAlerta); t <= ms("2026-12-17T00:00"); t += HORA) {
          const e = en(t);
          if (antes && (e.ramasAfectadas < antes.ramasAfectadas || e.fase < antes.fase || enColision(e) < enColision(antes))) return "retrocede en τ " + DENDRO.tau.corto(t);
          antes = e;
        }
        return true;
      });
      comprobar("Crecimiento exponencial: el cociente diario de ramas es casi constante", () => {
        const a = en("2026-11-10T12:00").ramasAfectadas / en("2026-11-09T12:00").ramasAfectadas;
        const b = en("2026-12-10T12:00").ramasAfectadas / en("2026-12-09T12:00").ramasAfectadas;
        return Math.abs(a - b) < 0.02 || `cocientes ${a.toFixed(3)} y ${b.toFixed(3)}`;
      });

      // Meta-tiempo τ
      comprobar("τ: 20/10 00:00 es 7525.000 y el colapso 7582.583", () => DENDRO.tau.corto(ms(cr.inicioAlerta)) === "7525.000" && DENDRO.tau.corto(ms(cr.colapsoTotal)) === "7582.583");
      comprobar("τ: cuentas atrás en ciclos, pulsos y latidos", () => {
        const c = DENDRO.tau.ciclo(), p = DENDRO.tau.pulso();
        const r = [DENDRO.tau.cuenta(3.2089 * c), DENDRO.tau.cuenta(412.5 * p), DENDRO.tau.cuenta(37 * DENDRO.tau.latido()), DENDRO.tau.cuenta(-2 * c)];
        return JSON.stringify(r) === JSON.stringify(["T−3.208 c", "T−412 p", "T−37 l", "T+2.000 c"]) || r.join(" | ");
      });
      comprobar("Reloj: la hora local de Bogotá se convierte bien (UTC−5)", () => ms("2026-12-16T14:00") === Date.UTC(2026, 11, 16, 19, 0));

      // Parejas, ataques y desenlaces
      comprobar("Δω₀ = |ω_a − ω_b| (C-03)", () => { const p = par(en(cr.inicioAlerta), "C-03"); return Math.abs(p.deltaOmega0 - Math.abs(2.7183 - 2.7461)) < 1e-9; });
      comprobar("Separación de C-03 baja hora a hora durante la aproximación y llega a 0 en el contacto", () => {
        const contacto = ms("2026-11-18T22:05");
        let antes = 2;
        for (let t = contacto - 7 * 24 * HORA + HORA; t < contacto; t += HORA) {
          const s = par(en(t), "C-03").separacion;
          if (s >= antes) return "no baja en τ " + DENDRO.tau.corto(t);
          antes = s;
        }
        return par(en(contacto), "C-03").separacion === 0;
      });
      comprobar("10-25: Ostrakh ataca a Velmora (antes del contacto)", () => en("2026-10-25T12:00").ataques.some((a) => a.desde === OSTRAKH && a.hacia === VELMORA));
      comprobar("11-20: C-03 en HOSTILIDADES con ataques en ambos sentidos", () => {
        const e = en("2026-11-20T12:00");
        const at = e.ataques.filter((a) => a.pareja === "C-03");
        return par(e, "C-03").estado === "HOSTILIDADES" && at.some((a) => a.desde === CENIZA) && at.some((a) => a.desde === ARBOREA);
      });
      comprobar("11-20: C-01 resuelta (Velmora sobrevive) y C-02 fusionada", () => {
        const e = en("2026-11-20T12:00");
        return par(e, "C-01").estado === "SUPERVIVIENTE" && tierra(e, VELMORA).estado === "SUPERVIVIENTE" &&
          tierra(e, OSTRAKH).estado === "ANIQUILADA" && par(e, "C-02").estado === "FUSIONADA";
      });
      comprobar("C-12: la aproximación empieza el 10/12, como dice el registro", () =>
        par(en("2026-12-10T05:00"), "C-12").estado === "ESTABLE" && par(en("2026-12-10T07:00"), "C-12").estado === "APROXIMACIÓN");
      comprobar("Pareja principal en fechas clave", () => {
        const esperadas = { "2026-10-19": "C-01", "2026-10-25": "C-01", "2026-11-20": "C-03", "2026-12-05": "C-06", "2026-12-15": "C-12" };
        for (const [f, id] of Object.entries(esperadas)) if (en(f + "T12:00").parejaPrincipal !== id) return `${f}: ${en(f + "T12:00").parejaPrincipal} (esperaba ${id})`;
        return true;
      });

      // Registro
      comprobar("El registro de hace una hora sigue igual ahora (historial estable)", () => {
        const clave = (ev) => ev.instante + ev.texto;
        const ahora = new Set(en("2026-11-20T15:00").registro.map(clave));
        return en("2026-11-20T14:00").registro.every((ev) => ahora.has(clave(ev))) || "falta alguna entrada anterior";
      });
      comprobar("La corrupción visual solo avanza en el mismo día: una entrada corrupta no vuelve a verse limpia", () => {
        const a = en("2026-12-05T10:00").registro, b = en("2026-12-05T18:00").registro;
        const marca = new Map(b.map((ev) => [ev.instante + ev.texto, ev.corrupta]));
        return a.every((ev) => !ev.corrupta || marca.get(ev.instante + ev.texto)) || "alguna entrada corrupta se limpia";
      });
      comprobar("El registro no muestra eventos futuros", () => { const t = ms("2026-11-20T12:00"); return en(t).registro.every((ev) => ev.instante <= t); });
      comprobar("Tierra Gris usa la máscara real", () => tierra(en(cr.inicioAlerta), "MYTH·7Y·A4R·G2").globo.mascara === "tierra-gris" && !!window.DENDRO_MASCARAS["tierra-gris"]);

      // Ejes para las vistas
      comprobar("serieRamas: de la primera colisión al colapso, creciente, con el futuro marcado", () => {
        const t = ms("2026-11-20T12:00"), s = en(t).ejes.serieRamas;
        const creciente = s.every((x, i) => i === 0 || x.valor >= s[i - 1].valor);
        const corte = s.findIndex((x) => x.futuro);
        return s[0].valor === 2 && s[s.length - 1].valor === cr.ramasAfectadasFinal && creciente && s[corte - 1].instante <= t && s[corte].instante > t;
      });
      comprobar("Ningún texto de pantalla lleva fechas de nuestro calendario", () => {
        const FECHA = /20\d\d-\d\d|\b(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/i;
        for (const x of ["2026-10-27T12:00", "2026-12-15T23:00"]) {
          const e = en(x);
          const textos = [...e.registro.map((r) => r.texto), ...e.mensajes.flatMap((m) => [m.asunto, m.de, ...m.cuerpo]),
            ...e.archivo.flatMap((d) => [d.titulo, ...d.texto.map((l) => (typeof l === "string" ? l : l.direccion + " " + l.sello))])];
          const malo = textos.find((s) => FECHA.test(s));
          if (malo) return malo;
        }
        return true;
      });
      // Catálogo del multiverso (02-diseno.md §4.4)
      const mv = DENDRO_CONFIG.multiverso;
      const cat = DENDRO.multiverso.catalogo();
      const huella = (c) => DENDRO.prng.hash(c.nodos.map((n) => n.codigo + n.omega + n.regimen + n.tecnologia).join() +
        c.parejas.map((p) => p.id + p.a + p.b + p.contacto + p.postura + p.desenlace).join());
      comprobar(`Catálogo: ${cat.total} ramas, entre ${mv.ramasMin} y ${mv.ramasMax}`, () => cat.total >= mv.ramasMin && cat.total <= mv.ramasMax);
      comprobar("Catálogo: idéntico al generarlo de nuevo", () => {
        const antes = huella(cat);
        window.DENDRO_DATOS.tierras = [...window.DENDRO_DATOS.tierras];   // invalida la memoria del catálogo
        const otro = DENDRO.multiverso.catalogo();
        return otro !== cat && huella(otro) === antes && otro.total === cat.total;
      });
      comprobar("Catálogo: códigos únicos con segmentos de 2, 3, 2 y 1 caracteres sin I ni O", () => {
        const re = /^MYTH(·[0-9A-HJ-NP-Z]{2}(·[0-9A-HJ-NP-Z]{3}(·[0-9A-HJ-NP-Z]{2}(·[0-9A-HJ-NP-Z])?)?)?)?$/;
        const malo = cat.nodos.find((n) => !re.test(n.codigo));
        return (!malo && new Set(cat.nodos.map((n) => n.codigo)).size === cat.nodos.length) || (malo ? malo.codigo : "códigos repetidos");
      });
      comprobar("Catálogo: 13 primarias, 7 jóvenes con saltos 1–7", () => {
        const prim = cat.nodos.filter((n) => n.nivel === 1), jovenes = prim.filter((n) => n.joven);
        return prim.length === 13 && jovenes.map((n) => n.salto).sort().join() === "1,2,3,4,5,6,7";
      });
      comprobar("Catálogo: las 24 nombradas en su código, con su nombre", () =>
        window.DENDRO_DATOS.tierras.every((t) => cat.porCodigo[t.codigo] && cat.porCodigo[t.codigo].nombre === t.nombre && cat.porCodigo[t.codigo].nombrada) &&
        cat.nodos.filter((n) => n.nombrada).length === 24);
      comprobar("Catálogo: Sarmiento reservado, de baja y fuera del total", () => {
        const s = cat.porCodigo["MYTH·4K·7A2·S5"];
        return !!s && s.baja && cat.total === cat.nodos.length - 1 && en(cr.inicioAlerta).tierras.porCodigo("MYTH·4K·7A2·S5") === null;
      });
      comprobar("Catálogo: parejas nombradas entre hermanas (C-08, madre e hija)", () => window.DENDRO_DATOS.colisiones.every((p) => {
        const a = cat.porCodigo[p.a], b = cat.porCodigo[p.b];
        return a.padre === b.padre || a.codigo === b.padre || b.codigo === a.padre;
      }));
      comprobar("Catálogo: cada rama en una pareja como mucho; generadas sin nombradas", () => {
        const vistas = new Set();
        for (const p of [...window.DENDRO_DATOS.colisiones, ...cat.parejas]) for (const c of [p.a, p.b]) { if (vistas.has(c)) return "repetida " + c; vistas.add(c); }
        return cat.parejas.every((p) => !cat.porCodigo[p.a].nombrada && !cat.porCodigo[p.b].nombrada);
      });
      comprobar("Disposición: un punto por rama dibujada y búsqueda del más cercano", () => {
        const d = DENDRO.multiverso.disposicion(), c = VELMORA, q = d.posiciones[c];
        return Object.keys(d.posiciones).length === cat.total && d.cercano(q.x + 0.0005, q.y, 0.05) === c;
      });

      // Cadena exponencial (02-diseno.md §4.5)
      const parejasCadena = en(cr.inicioAlerta).parejas, generadas = parejasCadena.filter((p) => !p.nombrada);
      comprobar(`Cadena: ${generadas.length} parejas generadas (config: ${mv.cascada.parejasGeneradas})`, () => generadas.length === mv.cascada.parejasGeneradas);
      comprobar("Cadena: C-01 es el primer contacto y la primera generada toca ~6 ciclos después", () => {
        const primera = parejasCadena.reduce((m, p) => (p.contacto < m.contacto ? p : m));
        const g = Math.min(...generadas.map((p) => p.contacto));
        const ciclos = (g - ms(cr.primeraColision)) / DENDRO.tau.ciclo();
        return (primera.id === "C-01" && ciclos > 5 && ciclos < 7.5) || `${primera.id}, ${ciclos.toFixed(2)} c`;
      });
      comprobar("Cadena: todas antes del colapso y con ids por orden de contacto", () => generadas.every((p, i) =>
        p.contacto < ms(cr.colapsoTotal) && p.id === "C-" + String(13 + i).padStart(4, "0") && (i === 0 || p.contacto >= generadas[i - 1].contacto)));
      comprobar("Cadena: los contactos por semana completa crecen", () => {
        const semanas = [];
        for (const p of generadas) { const k = Math.floor((p.contacto - ms(cr.primeraColision)) / (7 * DIA)); semanas[k] = (semanas[k] || 0) + 1; }
        const completas = Math.floor((ms(cr.colapsoTotal) - ms(cr.primeraColision)) / (7 * DIA));
        const lista = Array.from(semanas, (x) => x || 0).slice(0, completas);
        return lista.every((x, i) => i === 0 || x > lista[i - 1]) || lista.join(" ");
      });
      comprobar("Cadena: unas 60 en las últimas 14 horas", () => {
        const n = generadas.filter((p) => p.contacto >= ms(cr.colapsoTotal) - 14 * 3600000).length;
        return (n >= 50 && n <= 70) || String(n);
      });
      comprobar("Cadena: el orden sigue los saltos (salto 1 … 7 y después las antiguas)", () => generadas.every((p, i) => i === 0 || p.grupo >= generadas[i - 1].grupo));
      comprobar("Cadena: una fracción de las generadas es hostil y ataca", () => {
        const hostiles = generadas.filter((p) => /hostil/.test(p.postura)).length / generadas.length;
        return (hostiles > 0.2 && hostiles < 0.4 && en("2026-12-05T12:00").ataques.some((a) => a.pareja.length === 6)) || hostiles.toFixed(2);
      });
      comprobar("Ramas en colisión: crecen de forma exponencial (más en la última semana que en todo noviembre)", () => {
        const a = en("2026-11-01T00:00").enColision, b = en("2026-12-01T00:00").enColision, c = en("2026-12-08T00:00").enColision, d = en("2026-12-15T00:00").enColision;
        return (d - c > b - a && b > a && en(cr.colapsoTotal).enColision === 2 * parejasCadena.length) || [a, b, c, d].join(" ");
      });

      // Cohesión N̂ y guardianes (02-diseno.md §4.6)
      comprobar("N̂: 1 antes del contacto, no crece hora a hora, 0 en el colapso", () => {
        if (en("2026-10-27T03:16").myth.cohesion !== 1 || en(cr.colapsoTotal).myth.cohesion !== 0) return "extremos";
        let antes = 2;
        for (let t = ms(cr.primeraColision); t <= ms(cr.colapsoTotal); t += 3600000) {
          const n = en(t).myth.cohesion;
          if (n > antes) return "crece en τ " + DENDRO.tau.corto(t);
          antes = n;
        }
        return true;
      });
      comprobar("N̂ cruza 0.60 el 12-09", () => en("2026-12-09T00:00").myth.cohesion > 0.6 && en("2026-12-10T00:00").myth.cohesion < 0.6);
      comprobar("N̂: el desgarro de C-12 la parte a la mitad", () => {
        const c12 = ms("2026-12-14T23:58");
        const r = en(c12).myth.cohesion / en(c12 - 60000).myth.cohesion;
        return (r > 0.45 && r < 0.51) || r.toFixed(3);
      });
      comprobar("Guardianes: cinco, caen en orden y el último a las 14:00 del 16/12", () => {
        const g = en("2026-12-16T13:59").myth.guardianes, h = en(cr.colapsoTotal).myth.guardianes;
        return g.length === 5 && g.filter((x) => x.caido).length === 4 && h.every((x) => x.caido) && en("2026-12-09T12:00").myth.guardianes.every((x) => !x.caido);
      });
      comprobar("serieCohesion: de 1 a 0, sin crecer, con el futuro marcado", () => {
        const s = en("2026-11-20T12:00").ejes.serieCohesion;
        return s[0].valor > 0.99 && s[s.length - 1].valor === 0 && s.some((x) => x.futuro) && s.every((x, i) => i === 0 || x.valor <= s[i - 1].valor);
      });

      // Firmas de pareja (RF-19)
      comprobar("serieFirmas: convergen al contacto, se cortan en la destruida y se unen en la fusión", () => {
        const e = en("2026-12-14T12:00");
        const c01 = DENDRO.cronologia.serieFirmas(par(e, "C-01"), 200), c02 = DENDRO.cronologia.serieFirmas(par(e, "C-02"), 200);
        const inicial = c01.puntos[0], contacto = c01.puntos.find((x) => x.tau >= c01.marcas.contacto), tras = c01.puntos[c01.puntos.length - 1];
        const fus = c02.puntos[c02.puntos.length - 1];
        const d0 = par(e, "C-01").deltaOmega0;
        return (Math.abs(Math.abs(inicial.wa - inicial.wb) - d0) < 1e-9 && Math.abs(contacto.wa - contacto.wb) < 1e-9 &&
          tras.wb === null && tras.wa !== null && c01.marcas.destruidas.join() === OSTRAKH && fus.wa === fus.wb && fus.wa !== null) || "falla";
      });

      // Globos (T6.6)
      comprobar("Globos: caché limitada para las generadas; MYTH y nombradas fijas", () => {
        const fijosAntes = DENDRO.globo.enCache().fijos;
        DENDRO.globo.modelo("B-0x01", {});
        DENDRO.globo.modelo("B-0x01", {});
        for (const n of cat.nodos.filter((x) => !x.nombrada && !x.raiz).slice(0, mv.cacheGlobos + 10)) DENDRO.globo.modelo(n.semillaGlobo, n.globo, true);
        const c = DENDRO.globo.enCache();
        return (c.generados === mv.cacheGlobos && c.fijos === fijosAntes + 1) || JSON.stringify(c);
      });


      // Credencial de dirección (RF-18)
      comprobar("SHA-256: vector conocido de «abc»", () => DENDRO.sha256("abc") === "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad");
      comprobar("Credencial: la clave del lore coincide (sin mayúsculas, tildes ni espacios); otra no", () =>
        DENDRO.credencial.valida(DENDRO.credencial.hash("Postrera")) && DENDRO.credencial.valida(DENDRO.credencial.hash(" postréra ")) &&
        !DENDRO.credencial.valida(DENDRO.credencial.hash("VELMORA")) && !DENDRO.credencial.valida(""));
      comprobar("Credencial: abre y cierra en DENDRO.local, y el Estado no cambia", () => {
        const t = "2026-12-12T12:00", antes = JSON.stringify(en(t));
        DENDRO.local.credencial(DENDRO.credencial.hash("POSTRERA"));
        const abierta = DENDRO.local.credencial(), con = JSON.stringify(en(t));
        DENDRO.local.credencial(null);
        return abierta && !DENDRO.local.credencial() && con === antes;
      });

      // Canales y archivo (RF-17)
      comprobar("Canales: G-01 al empezar la alerta; dirección vacía hasta D-01", () => {
        const a = en("2026-10-20T08:00").mensajes, b = en("2026-10-27T08:59").mensajes, c = en("2026-10-27T09:00").mensajes;
        return a.map((m) => m.id).join() === "G-01" && !b.some((m) => m.canal === "direccion") && c.some((m) => m.id === "D-01");
      });
      comprobar("Canales: 10 mensajes generales y 17 de dirección; solo D-14 visible sin credencial", () => {
        const m = en("2026-12-16T13:59").mensajes;
        const g = m.filter((x) => x.canal === "general").length, d = m.filter((x) => x.canal === "direccion");
        return (g === 10 && d.length === 17 && d.filter((x) => x.visibleSinCredencial).map((x) => x.id).join() === "D-14") || `${g} / ${d.length}`;
      });
      comprobar("Archivo: los clasificados no existen antes de su emisión", () =>
        !en("2026-12-06T08:59").archivo.some((d) => d.codigo === "CLAS-INJ-01") && en("2026-12-06T09:00").archivo.some((d) => d.codigo === "CLAS-INJ-01") &&
        en("2026-10-20T12:00").archivo.filter((d) => d.clasificado).length === 0);
      comprobar("Archivo: PROC-FIR-02 pasa a la rev. 4 en vivo", () => {
        const a = en("2026-10-30T08:59").archivo.find((d) => d.codigo === "PROC-FIR-02"), b = en("2026-10-30T09:00").archivo.find((d) => d.codigo === "PROC-FIR-02");
        return a.rev === 3 && b.rev === 4 && b.texto.length > a.texto.length && b.revisado > a.revisado;
      });
      comprobar("Archivo: PROC-ADM-01 lleva la pista y PROC-MYT-00 un fragmento de dirección", () => {
        const docs = en("2026-10-20T12:00").archivo;
        return docs.find((d) => d.codigo === "PROC-ADM-01").texto.some((l) => /no debería existir/.test(l)) &&
          docs.find((d) => d.codigo === "PROC-MYT-00").texto.some((l) => typeof l === "object" && l.direccion && l.sello);
      });

      // Revelaciones (04-lore.md §7)
      comprobar("Hitos: omega i a las 04:40 del 11-08, sarmiento el 12-04, silueta el 16/12", () => {
        const h = (x) => en(x).hitos;
        return !h("2026-11-08T04:39").omegaI && h("2026-11-08T04:40").omegaI && !h("2026-12-04T11:59").sarmiento &&
          h("2026-12-04T12:00").sarmiento && !h("2026-12-15T23:59").silueta && h(cr.inicioRectaFinal).silueta;
      });
      comprobar("Silueta: 0.15 al aparecer, 1 en el último minuto, nada tras el colapso", () => {
        const a = en(cr.inicioRectaFinal).silueta, b = en("2026-12-16T13:59").silueta, c = en(cr.colapsoTotal).silueta;
        return a.visible && Math.abs(a.opacidad - 0.15) < 1e-9 && b.visible && b.opacidad === 1 && !c.visible && !en("2026-12-15T12:00").silueta.visible;
      });
      comprobar("Registro: pistas corruptas fijas en su minuto", () => {
        const r = en("2026-12-03T05:05").registro.map((x) => x.texto);
        return r.some((x) => x.includes("P░ST░░░A")) && r.some((x) => x.includes("ESC░RDA")) && !en("2026-12-03T05:04").registro.some((x) => x.texto.includes("ESC░RDA"));
      });
      comprobar("Expedientes: MYTH con sus eventos y las generadas con los de su pareja", () => {
        const e = en("2026-12-12T12:00");
        const myth = e.tierras.porCodigo("MYTH"), gen = e.tierras.porCodigo(cat.parejas[0].a);
        return myth.raiz && myth.eventos.some((x) => /N̂/.test(x.texto)) && gen.eventos.length > 0 && gen.eventos.every((x) => x.tierras.includes(gen.codigo));
      });

      // Rampa de convergencia y protocolos (Fase 8)
      comprobar("Rampa: tonos de rama a arma, con tonoRampa(0) = rama y tonoRampa(1) = arma", () => {
        const r = DENDRO.tema.rampa(), c = DENDRO_CONFIG.colores;
        return r.length === DENDRO_CONFIG.vectores.rampaPasos && r[0].toLowerCase() === c.rama.toLowerCase() && r[r.length - 1].toLowerCase() === c.arma.toLowerCase() &&
          DENDRO.tema.color(DENDRO.tema.tonoRampa(1)) === r[r.length - 1] && DENDRO.tema.tonoRampa(0) === "rampa0";
      });
      comprobar("Protocolos: siete en el catálogo; PC-90 solo desde el 12-01", () =>
        en("2026-11-30T23:59").protocolos.length === 6 && en("2026-12-01T00:00").protocolos.some((p) => p.codigo === "PC-90") && window.DENDRO_DATOS.protocolos.length === 7);

      comprobar("calcularEstado tarda menos de 20 ms de media", () => {
        const t0 = performance.now();
        for (let i = 0; i < 20; i++) en(ms("2026-12-12T12:00") + i * 60000);
        const medio = (performance.now() - t0) / 20;
        return medio < 20 || `${medio.toFixed(1)} ms`;
      });

      const fallos = resultados.filter((r) => !r.ok).length;
      const resumen = document.getElementById("resumen");
      resumen.textContent = fallos ? `✗ ${fallos} de ${resultados.length} pruebas fallan` : `✓ ${resultados.length} de ${resultados.length} pruebas en verde`;
      resumen.className = "resumen " + (fallos ? "fallo" : "ok");
      document.getElementById("lista").innerHTML = resultados
        .map((r) => `<li class="${r.ok ? "ok" : "fallo"}">${r.ok ? "OK   " : "FALLO"} ${r.nombre}${r.detalle ? " — " + r.detalle : ""}</li>`)
        .join("");
      document.title = (fallos ? "✗ " : "✓ ") + document.title;
    })();
  </script>
