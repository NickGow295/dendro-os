<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DENDRO-OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=block">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/crt.css">
</head>
<body>
  <main id="monitor" class="monitor" data-estado="apagado">
    <div class="carcasa">
      <div class="bisel">
        <div id="vidrio" class="vidrio">
          <div id="tubo" class="tubo"></div>
          <div id="haz" class="haz" aria-hidden="true"></div>
        </div>
      </div>

      <div class="frente">
        <div class="placa">
          <span id="placa-siglas" class="placa-siglas"></span>
          <span id="placa-sistema" class="placa-sistema"></span>
        </div>
        <div class="rejillas" aria-hidden="true"></div>
        <div class="control">
          <p class="indicacion"><span class="indicacion-teclado">PULSE <span class="simbolo-indicacion">⏻</span> O CUALQUIER TECLA</span><span class="indicacion-tactil">TOQUE <span class="simbolo-indicacion">⏻</span> PARA ENCENDER</span></p>
          <button id="boton-encendido" class="boton-encendido" type="button" aria-label="Encender el monitor" aria-pressed="false">
            <span class="simbolo" aria-hidden="true">⏻</span>
          </button>
          <span class="led" aria-hidden="true"></span>
          <button id="boton-sonido" class="boton-sonido" type="button" aria-pressed="false" aria-label="Activar sonido">
            <span class="interruptor" aria-hidden="true"></span><span class="rotulo-sonido" aria-hidden="true">SONIDO</span>
          </button>
        </div>
        <span id="placa-modelo" class="placa-modelo"></span>
      </div>

      <div id="medidor" class="medidor" hidden></div>
    </div>
  </main>

  <input id="entrada" class="entrada-oculta" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Entrada de texto del terminal">
  <div id="espejo" class="solo-lectores" role="log" aria-live="off" aria-label="Contenido de la pantalla"></div>

  <script src="config.js"></script>
  <script src="data/myth.js"></script>
  <script src="data/tierras.js"></script>
  <script src="data/tierra-gris.js"></script>
  <script src="data/generacion.js"></script>
  <script src="data/colisiones.js"></script>
  <script src="data/eventos.js"></script>
  <script src="data/mensajes.js"></script>
  <script src="data/archivo.js"></script>
  <script src="data/revelaciones.js"></script>
  <script src="data/protocolos.js"></script>
  <script src="js/nucleo/prng.js"></script>
  <script src="js/nucleo/ruido.js"></script>
  <script src="js/nucleo/reloj.js"></script>
  <script src="js/nucleo/tau.js"></script>
  <script src="js/nucleo/multiverso.js"></script>
  <script src="js/nucleo/cronologia.js"></script>
  <script src="js/nucleo/sha256.js"></script>
  <script src="js/nucleo/tema.js"></script>
  <script src="js/nucleo/sonido.js"></script>
  <script src="js/nucleo/teclado.js"></script>
  <script src="js/nucleo/local.js"></script>
  <script src="js/nucleo/crt.js"></script>
  <script src="js/nucleo/glitch.js"></script>
  <script src="js/ui/rejilla.js"></script>
  <script src="js/ui/vectores.js"></script>
  <script src="js/ui/globo.js"></script>
  <script src="js/ui/lista.js"></script>
  <script src="js/ui/escritor.js"></script>
  <script src="js/ui/monitor.js"></script>
  <script src="js/ui/silueta.js"></script>
  <script src="js/pantallas/arranque.js"></script>
  <script src="js/pantallas/acceso.js"></script>
  <script src="js/pantallas/escritorio.js"></script>
  <script src="js/pantallas/colapso.js"></script>
  <script src="js/vistas/comun.js"></script>
  <script src="js/vistas/colision.js"></script>
  <script src="js/vistas/arbol.js"></script>
  <script src="js/vistas/monitor.js"></script>
  <script src="js/vistas/osciloscopio.js"></script>
  <script src="js/vistas/expediente.js"></script>
  <script src="js/vistas/registro.js"></script>
  <script src="js/vistas/comunicaciones.js"></script>
  <script src="js/vistas/archivo.js"></script>
  <script src="js/vistas/contencion.js"></script>
  <script src="js/vistas/terminal.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
